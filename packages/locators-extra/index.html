<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Locators Extra Example</title>
    </head>
    <body>
        <div id="root">
            <ul>
                <li>one</li>
                <li class="target">two</li>
                <li>three</li>
            </ul>
            <section>
                <button type="button">Click me</button>
            </section>
        </div>
        <div id="dnd-area">
            <div
                id="draggable"
                style="
                    position: fixed;
                    left: 20px;
                    top: 300px;
                    width: 50px;
                    height: 50px;
                    background: teal;
                "
            ></div>
            <div
                id="dropzone"
                style="
                    position: fixed;
                    left: 200px;
                    top: 280px;
                    width: 100px;
                    height: 100px;
                    border: 2px dashed gray;
                "
            ></div>
            <p id="dnd-status" style="position: fixed; top: 400px">idle</p>
        </div>
        <script>
            const draggable = document.getElementById("draggable");
            const dropzone = document.getElementById("dropzone");
            const status = document.getElementById("dnd-status");
            let dragging = false;
            let moves = 0;
            draggable.addEventListener("mousedown", () => {
                dragging = true;
                moves = 0;
                status.textContent = "dragging";
            });
            document.addEventListener("mousemove", (e) => {
                if (!dragging) return;
                moves++;
                draggable.style.left = e.clientX - 25 + "px";
                draggable.style.top = e.clientY - 25 + "px";
            });
            document.addEventListener("mouseup", (e) => {
                if (!dragging) return;
                dragging = false;
                const zone = dropzone.getBoundingClientRect();
                const inside =
                    e.clientX >= zone.left &&
                    e.clientX <= zone.right &&
                    e.clientY >= zone.top &&
                    e.clientY <= zone.bottom;
                status.textContent = inside
                    ? `dropped after ${moves} moves`
                    : `released at ${e.clientX},${e.clientY} after ${moves} moves`;
            });
        </script>
    </body>
</html>
